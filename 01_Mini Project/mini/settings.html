<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | ClassConnect</title>
    <link rel="stylesheet" href="settings.css">
</head>
<body>
    <div class="container">
        <h1 class="page-title">Settings</h1>
        <div class="settings-content">
            <!-- Profile Section -->
            <section class="profile-section">
                <div class="profile-header">
                    <h2>Profile Settings</h2>
                </div>
                <div class="profile-body">
                    <div class="profile-img">
                        <img id="profile-picture" src="https://via.placeholder.com/150" alt="Profile Picture">
                        <button class="upload-btn" onclick="document.getElementById('file-input').click();">Upload Photo</button>
                        <input type="file" id="file-input" accept="image/*" style="display: none;" onchange="previewImage(event)">
                    </div>
                    <form class="profile-form">
                        <div class="form-group">
                            <label for="username">Username:</label>
                            <input type="text" id="username" placeholder="Enter your username">
                        </div>
                        <div class="form-group">
                            <label for="bio">Biography:</label>
                            <textarea id="bio" rows="4" placeholder="Tell us about yourself"></textarea>
                        </div>
                        <button type="submit" class="btn-save">Save Changes</button>
                    </form>
                </div>
            </section>

            <!-- Password Reset Section -->
            <section class="password-reset">
                <div class="section-header">
                    <h2>Password Reset</h2>
                </div>
                <div class="section-body">
                    <form>
                        <div class="form-group">
                            <label for="current-password">Current Password:</label>
                            <input type="password" id="current-password">
                        </div>
                        <div class="form-group">
                            <label for="new-password">New Password:</label>
                            <input type="password" id="new-password">
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirm New Password:</label>
                            <input type="password" id="confirm-password">
                        </div>
                        <button type="submit" class="btn-save">Reset Password</button>
                    </form>
                </div>
            </section>

            <!-- Notification Preferences Section -->
            <section class="notification-preferences">
                <div class="section-header">
                    <h2>Notification Preferences</h2>
                </div>
                <div class="section-body">
                    <form>
                        <div class="form-group">
                            <label><input type="checkbox" checked> Email Notifications</label>
                        </div>
                        <div class="form-group">
                            <label><input type="checkbox"> SMS Notifications</label>
                        </div>
                        <div class="form-group">
                            <label><input type="checkbox"> Push Notifications</label>
                        </div>
                        <button type="submit" class="btn-save">Update Preferences</button>
                    </form>
                </div>
            </section>

            <!-- Privacy Settings Section -->
            <section class="privacy-settings">
                <div class="section-header">
                    <h2>Privacy Settings</h2>
                </div>
                <div class="section-body">
                    <form>
                        <div class="form-group">
                            <label><input type="checkbox"> Make Profile Private</label>
                        </div>
                        <div class="form-group">
                            <label><input type="checkbox" checked> Allow Search Engine Indexing</label>
                        </div>
                        <button type="submit" class="btn-save">Save Privacy Settings</button>
                    </form>
                </div>
            </section>

            <!-- Contact Admin Section -->
            <section class="contact-admin">
                <div class="section-header">
                    <h2>Contact Admin</h2>
                </div>
                <div class="section-body">
                    <form>
                        <div class="form-group">
                            <label for="contact-subject">Subject:</label>
                            <input type="text" id="contact-subject" placeholder="Subject of your message">
                        </div>
                        <div class="form-group">
                            <label for="contact-message">Message:</label>
                            <textarea id="contact-message" rows="4" placeholder="Write your message here"></textarea>
                        </div>
                        <button type="submit" class="btn-save">Send Message</button>
                    </form>
                </div>
            </section>
        </div>
    </div>

    <script>
        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('profile-picture').src = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }
    </script>
</body>
</html>
